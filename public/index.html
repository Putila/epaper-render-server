<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="iframe-container">
    <!-- Replace the `cont` query param with your own digitransit display config from https://tremonitori.digitransit.fi/ -->
    <iframe src="https://tremonitori.digitransit.fi/"></iframe>
  </div>

  <div class="gym-container">
    <div class="schedule-container">
      <div class="gym-card card-city" data-gym="city">
        <h2>City</h2>
        <div class="gym-list"></div>
      </div>

      <div class="gym-card card-park" data-gym="park">
        <h2>Park</h2>
        <div class="gym-list"></div>
      </div>

      <div class="gym-card card-hervanta" data-gym="hervanta">
        <h2>Hervanta</h2>
        <div class="gym-list"></div>
      </div>
    </div>
  </div>

  <script src="gym.js"></script>
</body>
</html>

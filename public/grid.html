<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="grid.css">
  <link rel="stylesheet" href="gym-schedule.css">
  <script src="/api/settings.js"></script>
</head>
<body>
  <div class="grid-container">
    <!-- Top-left: Transit iframe — URL is configurable from /admin (settings.transitUrl) -->
    <div class="grid-top-left">
      <iframe id="transit-iframe" src="https://tremonitori.digitransit.fi/"></iframe>
    </div>

    <!-- Bottom-left: Weather + Language widgets (or advanced weather, per settings) -->
    <div class="grid-bottom-left">
      <div class="weather-advanced" id="weatherAdvanced" hidden></div>

      <div class="weather-widget" id="weatherSimple">
        <div class="weather-header">
          <div class="weather-location">Tampere</div>
          <div class="weather-date" id="weatherDate"></div>
        </div>
        <div class="weather-temp">--°C</div>
        <div class="weather-desc">Loading...</div>
        <div class="weather-forecast" id="weatherForecast"></div>
      </div>

      <div class="lang-widget" id="lang-spanish">
        <div class="word-label">Español</div>
        <div class="word-main spanish-word">---</div>
        <div class="word-sub spanish-translation">---</div>
      </div>

      <div class="lang-widget" id="lang-korean">
        <div class="word-label">한국어</div>
        <div class="word-main korean-word">---</div>
        <div class="word-sub korean-translation">---</div>
      </div>

      <div class="lang-widget" id="lang-japanese">
        <div class="word-label">日本語</div>
        <div class="word-main japanese-word">---</div>
        <div class="word-sub japanese-translation">---</div>
      </div>

      <div class="calendar-widget" id="calendar-widget" hidden>
        <div class="cal-header">Kalenteri</div>
        <div id="calendarEvents" class="cal-events"></div>
      </div>
    </div>

    <!-- Right: optional lunch (top) + Photo OR Gym schedule -->
    <div class="grid-right">
      <div id="right-lunch" class="lunch-slot" hidden>
        <div id="lunch-widget" class="lunch-widget"></div>
      </div>
      <div class="right-stack" id="right-stack">
        <div id="right-photo" class="right-slot">
          <img id="drivePhoto" src="/api/photo" alt="">
        </div>
        <div id="right-gym" class="right-slot" hidden>
          <div class="schedule-container">
            <div class="gym-card card-city">
              <h2>City</h2>
              <div class="gym-schedule gym-city" id="sched-city"></div>
            </div>
            <div class="gym-card card-park">
              <h2>Park</h2>
              <div class="gym-schedule gym-park" id="sched-park"></div>
            </div>
            <div class="gym-card card-hervanta">
              <h2>Hervanta</h2>
              <div class="gym-schedule gym-hervanta" id="sched-hervanta"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="right-board" class="right-board" hidden>
        <div id="board-widget" class="board-widget"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const s = window.DASHBOARD_SETTINGS || {
        gymHours: { start: 8, end: 11 },
        wordsEnabled: { spanish: true, korean: true, japanese: true }
      };
      // Use the server-provided Helsinki hour — the screenshot browser's local
      // timezone is unreliable in the jail.
      const h = (window.DASHBOARD_NOW && Number.isFinite(window.DASHBOARD_NOW.hour))
        ? window.DASHBOARD_NOW.hour : new Date().getHours();
      const { start, end } = s.gymHours;
      const showGym = start < end ? (h >= start && h < end) : (h >= start || h < end);
      document.getElementById('right-photo').hidden = showGym;
      document.getElementById('right-gym').hidden = !showGym;

      // Lunch widget: visible only when enabled and within configured hour window.
      const lunchEnabled = s.lunchEnabled !== false;
      const lh = s.lunchHours || { start: 6, end: 11 };
      const showLunch = lunchEnabled && (
        lh.start < lh.end ? (h >= lh.start && h < lh.end) : (h >= lh.start || h < lh.end)
      );
      document.getElementById('right-lunch').hidden = !showLunch;

      // Weather mode: advanced takes precedence and hides simple weather + languages.
      const advanced = s.advancedWeatherEnabled === true;
      const simple = s.simpleWeatherEnabled !== false;
      document.getElementById('weatherAdvanced').hidden = !advanced;
      document.getElementById('weatherSimple').hidden = advanced || !simple;

      const we = s.wordsEnabled || {};
      for (const lang of ['spanish', 'korean', 'japanese']) {
        const el = document.getElementById('lang-' + lang);
        if (!el) continue;
        el.hidden = advanced || we[lang] === false;
      }

      // Calendar widget: independent of weather mode — shown whenever enabled.
      const calEl = document.getElementById('calendar-widget');
      if (calEl) calEl.hidden = s.calendarEnabled === false;

      if (s.transitUrl) {
        const iframe = document.getElementById('transit-iframe');
        if (iframe) iframe.src = s.transitUrl;
      }
    })();
  </script>
  <script src="weather.js"></script>
  <script src="weather-advanced.js"></script>
  <script src="spanish-word.js"></script>
  <script src="korean-word.js"></script>
  <script src="japanese-word.js"></script>
  <script src="gym-schedule.js"></script>
  <script src="lunch.js"></script>
  <script src="calendar.js"></script>
  <script src="board.js"></script>
</body>
</html>
